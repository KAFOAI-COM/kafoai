name: Full Suite

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-suite-main
  cancel-in-progress: false

jobs:
  smoke:
    name: Pipeline smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
      - name: Run policy suite and structural checks
        run: |
          node --test tests/repository-hygiene.test.mjs tests/full-suite-workflow.test.mjs
          node --check .github/scripts/run-test-shard.mjs
          node --check .github/scripts/create-post-merge-evidence.mjs
          node --check support.js
          node -e "JSON.parse(require('node:fs').readFileSync('deploy/vercel.json', 'utf8'))"

  shard:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
      - name: Run shard ${{ matrix.shard }}/4
        run: node .github/scripts/run-test-shard.mjs ${{ matrix.shard }} --output-dir timing
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: timing/
          if-no-files-found: error

  evidence:
    name: Post-merge full-suite evidence
    needs: [smoke, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
      - name: Download timing artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4 # v4.3.0
        with:
          pattern: test-timings-shard-*
          path: timings
          merge-multiple: true
      - name: Validate post-merge evidence
        id: validate
        continue-on-error: true
        env:
          KAFO_SMOKE_RESULT: ${{ needs.smoke.result }}
          KAFO_MATRIX_RESULT: ${{ needs.shard.result }}
          KAFO_ARTIFACTS: test-timings-shard-1,test-timings-shard-2,test-timings-shard-3,test-timings-shard-4,post-merge-full-suite-evidence
        run: |
          node .github/scripts/create-post-merge-evidence.mjs --timings-dir timings --output post-merge-full-suite-evidence.json
      - name: Upload post-merge full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: post-merge-full-suite-evidence
          path: post-merge-full-suite-evidence.json
          if-no-files-found: error
      - name: Preserve evidence validation result
        if: always()
        run: test "${{ steps.validate.outcome }}" = success
